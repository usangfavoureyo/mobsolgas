uerySelector("#checkout");if(cb)cb.onclick=openCartPage}function empty(title,text,action,fn){view.innerHTML='<div class="page"><div class="eyebrow">MOBSOL GAS · ABUJA</div><h1>'+title+'</h1><section class="empty"><h2>'+title+'</h2><p>'+text+'</p><button class="primary" id="empty-action">'+action+'</button></section></div>';view.querySelector("#empty-action").onclick=fn}function ordersView(){view.innerHTML='<div class="page"><h1>Orders</h1><p class="muted">Order progress and exchange details in one place.</p><section class="orders-empty"><div><div class="eyebrow">NO ORDERS YET</div><h2>Your deliveries will appear here.</h2><p>Once ordering is connected, you can follow each exchange from confirmation to delivery.</p><button class="primary" id="start-order">Start an order <i class="icon action-arrow-icon" style="mask-image:url(/icons/hugeroundedicons/arrow-right-02-stroke-rounded.svg)"></i></button></div><div class="order-steps"><div class="eyebrow">WHAT YOU’LL BE ABLE TO FOLLOW</div><div class="order-step"><i>01</i><span><b>Order confirmed</b><small>Mobsol confirms your order and delivery details.</small></span></div><div class="order-step"><i>02</i><span><b>Preparing your exchange</b><small>Your full cylinder is prepared for dispatch.</small></span></div><div class="order-step"><i>03</i><span><b>Rider on the way</b><small>Track delivery and exchange at your door.</small></span></div></div></section><p class="connection">Live tracking will appear here when Mobsol order services are connected.</p></div>';document.getElementById("start-order").onclick=()=>setTab("Home")}function supportView(){view.innerHTML='<div class="page"><h1>How can we help?</h1><p class="muted">Quick answers about your cylinder exchange and delivery.</p><div class="support-actions"><button id="support-order"><i class="icon support-plus-icon" style="mask-image:url(/icons/hugeroundedicons/plus-sign-stroke-rounded.svg)"></i><span><b>Start an order</b><small>Choose a Mobsol cylinder</small></span><i c
